name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk trivia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: trivia-apk
          path: trivia.apk

      # Keeps one "latest" release whose trivia.apk is always the newest build.
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest trivia.apk --title "Latest build" \
            --notes "Built from ${GITHUB_SHA}" --target "${GITHUB_SHA}"
