name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk trivia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: trivia-apk
          path: trivia.apk

      # Keeps one "latest" release whose trivia.apk is always the newest build.
      # The release is updated in place rather than deleted and recreated,
      # which occasionally left it stuck as an unpublished draft.
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest trivia.apk --clobber
            gh release edit latest --draft=false --notes "Built from ${GITHUB_SHA}"
          else
            gh release create latest trivia.apk --verify-tag --title "Latest build" \
              --notes "Built from ${GITHUB_SHA}"
          fi
