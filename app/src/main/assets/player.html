<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html, body { margin: 0; height: 100%; background: #0e1220; color: #e8ecf8;
               font-family: sans-serif; overflow: hidden; }
  /* Layout: video top-left, round name underneath, answers down the right. */
  #video   { position: absolute; left: 2vw; top: 3vh; width: 62vw; height: 62vh; background: #000; }
  #video iframe { width: 100%; height: 100%; border: 0; }
  #round   { position: absolute; left: 2vw; top: 68vh; width: 62vw; height: 29vh;
             display: flex; align-items: center; justify-content: center;
             font-size: 7vh; font-weight: bold; color: #ffcd3c; text-align: center; }
  #answers { position: absolute; left: 66vw; top: 3vh; width: 32vw; height: 94vh;
             box-sizing: border-box; padding: 2vh 1.5vw; background: #171d33;
             border-radius: 1.5vh; font-size: 3.6vh; }
  #answers h2 { margin: 0 0 2vh; font-size: 4vh; color: #9fb0e0; }
  .dim { color: #6f7ba0; }
  #status  { position: absolute; left: 3vw; top: 5vh; padding: 1vh 1.5vw;
             background: rgba(0,0,0,.75); border-radius: 1vh; font-size: 3.5vh;
             opacity: 0; transition: opacity .3s; }
  #status.show { opacity: 1; }
  #error   { position: absolute; left: 2vw; top: 3vh; width: 62vw; height: 62vh;
             display: none; align-items: center; justify-content: center;
             background: #400; font-size: 4vh; text-align: center; }
</style>
</head>
<body>
<div id="video"><div id="player"></div></div>
<div id="error"></div>
<div id="status"></div>
<div id="round">Round name goes here</div>
<div id="answers"><h2>Answers</h2><div class="dim">Answers will appear here</div></div>

<script>
  // First test build: one fixed video. Choosing the video comes later.
  var VIDEO_ID = '7IQCIhPNFak';
  var player = null, ready = false, statusTimer = null;

  function fmt(s) {
    s = Math.max(0, Math.floor(s));
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  function showStatus(text) {
    var el = document.getElementById('status');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
  }
  function showError(text) {
    var el = document.getElementById('error');
    el.textContent = text;
    el.style.display = 'flex';
  }

  window.remote = {
    toggle: function () {
      if (!ready) return;
      if (player.getPlayerState() === YT.PlayerState.PLAYING) this.pause(); else this.play();
    },
    play: function () {
      if (!ready) return;
      player.playVideo();
      showStatus('▶ ' + fmt(player.getCurrentTime()));
    },
    pause: function () {
      if (!ready) return;
      player.pauseVideo();
      showStatus('⏸ ' + fmt(player.getCurrentTime()));
    },
    seek: function (delta) {
      if (!ready) return;
      var total = player.getDuration() || 0;
      var t = Math.max(0, player.getCurrentTime() + delta);
      if (total) t = Math.min(t, total - 1);
      player.seekTo(t, true);
      showStatus((delta < 0 ? '⏪ ' : '⏩ ') + fmt(t) + (total ? ' / ' + fmt(total) : ''));
    }
  };

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: VIDEO_ID,
      width: '100%', height: '100%',
      playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0,
                    playsinline: 1, iv_load_policy: 3, origin: location.origin },
      events: {
        onReady: function () { ready = true; player.playVideo(); },
        onError: function (e) {
          var why = { 2: 'bad video ID', 5: 'player error', 100: 'video not found',
                      101: 'embedding blocked by uploader', 150: 'embedding blocked by uploader',
                      153: 'player configuration (referrer) error' }[e.data] || 'unknown';
          showError('YouTube error ' + e.data + ': ' + why);
        }
      }
    });
  }

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = function () { showError('Could not reach YouTube. Check the internet connection.'); };
  document.head.appendChild(tag);
</script>
</body>
</html>
