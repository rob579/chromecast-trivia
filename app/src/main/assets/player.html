<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html, body { margin: 0; height: 100%; background: #0e1220; color: #e8ecf8;
               font-family: sans-serif; overflow: hidden; }
  /* Layout: video top-left, round name underneath, answers down the right. */
  #video   { position: absolute; left: 2vw; top: 3vh; width: 56vw; height: 56vh; background: #000; }
  #video iframe { width: 100%; height: 100%; border: 0; }
  .cover   { position: absolute; left: 2vw; top: 3vh; width: 56vw; height: 56vh;
             display: none; align-items: center; justify-content: center;
             font-size: 4vh; text-align: center; padding: 0 4vw; box-sizing: border-box; }
  #novideo { background: #171d33; color: #9fb0e0; }
  #error   { background: #400; }

  #bottom  { position: absolute; left: 2vw; top: 61vh; width: 56vw; height: 36vh;
             display: flex; align-items: center; }
  #roundbox { flex: 1; min-width: 0; text-align: center; padding: 0 1vw; }
  #roundnum { font-size: 3vh; color: #9fb0e0; margin-bottom: 1vh; }
  #round   { font-size: 6.2vh; font-weight: bold; color: #ffcd3c; line-height: 1.1;
             overflow: hidden; max-height: 13.8vh; }
  #scores  { display: flex; justify-content: center; gap: 4vw; margin-top: 1.6vh; }
  .score   { display: none; }
  .score .l { font-size: 2.3vh; color: #9fb0e0; }
  .score .v { font-size: 5vh; font-weight: bold; }
  #qrbox   { width: 17vw; text-align: center; font-size: 2.7vh; color: #e8ecf8; }
  #qrlabel { font-size: 2vh; color: #9fb0e0; }
  #qr      { width: 17vh; height: 17vh; border-radius: 1vh; display: none; margin: 0 auto 1vh; }

  #answers { position: absolute; left: 60vw; top: 3vh; width: 38vw; height: 94vh;
             box-sizing: border-box; padding: 2vh 1.5vw; background: #171d33;
             border-radius: 1.5vh; display: flex; flex-direction: column; }
  #answers h2 { margin: 0 0 1.5vh; font-size: 3.6vh; color: #9fb0e0; flex: none; }
  #list    { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .row     { flex: 1; min-height: 0; display: flex; align-items: center;
             border-top: 1px solid #262e4d; overflow: hidden; }
  .num     { flex: none; width: 2.2em; color: #ffcd3c; font-weight: bold; }
  .txt     { flex: 1; min-width: 0; max-height: 100%; overflow: hidden; line-height: 1.15;
             overflow-wrap: anywhere; }
  .dim     { color: #6f7ba0; font-size: 3.2vh; }

  #status  { position: absolute; left: 3vw; top: 5vh; padding: 1vh 1.5vw;
             background: rgba(0,0,0,.75); border-radius: 1vh; font-size: 3.5vh;
             opacity: 0; transition: opacity .3s; }
  #status.show { opacity: 1; }

  /* Full-screen video: the player covers everything; the rest keeps its
     layout underneath so it is ready the moment full screen is switched off. */
  body.full #video, body.full .cover { left: 0; top: 0; width: 100vw; height: 100vh; z-index: 5; }
  body.full #bottom, body.full #answers { visibility: hidden; }
  #status  { z-index: 6; }
</style>
</head>
<body>
<div id="video"><div id="player"></div></div>
<div id="novideo" class="cover">Scan the code with your phone to choose a video</div>
<div id="error" class="cover"></div>
<div id="status"></div>

<div id="bottom">
  <div id="roundbox"><div id="roundnum"></div><div id="round"></div>
    <div id="scores">
      <div class="score" id="rscore"><div class="l">This round</div><div class="v" id="rscorev"></div></div>
      <div class="score" id="qscore"><div class="l">Quiz total</div><div class="v" id="qscorev"></div></div>
    </div>
  </div>
  <div id="qrbox"><img id="qr" alt=""><div id="qrlabel">Control page</div><div id="url"></div></div>
</div>

<div id="answers"><h2>Answers</h2><div id="list"></div></div>

<script>
  var env = null;            // latest data pushed in by the app
  var player = null, apiReady = false, playerReady = false, loadedId = null;
  var statusTimer = null;
  var captionsApplied = null;   // which video + setting the subtitles were last set for

  function $(id) { return document.getElementById(id); }
  function fmt(s) {
    s = Math.max(0, Math.floor(s));
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  function showStatus(text) {
    var el = $('status');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
  }
  function showError(text) {
    $('error').textContent = text;
    $('error').style.display = text ? 'flex' : 'none';
  }

  // ---- Called by the app whenever the quiz changes ----
  window.applyState = function (e) {
    env = e;
    render();
    syncVideo();
    syncCaptions();
  };

  // ---- Subtitles ----
  // YouTube only accepts subtitle changes once a video is actually playing,
  // so this is retried on every play until it has been applied.
  function syncCaptions() {
    if (!playerReady || !env) return;
    var on = !!env.state.captions, key = loadedId + '|' + on;
    if (key === captionsApplied) return;
    if (player.getPlayerState() !== YT.PlayerState.PLAYING) return;
    captionsApplied = key;
    try {
      if (on) {
        player.loadModule('captions');
        setTimeout(function () {
          try {
            var tracks = player.getOption('captions', 'tracklist') || [], pick = null;
            tracks.forEach(function (t) {
              if (!pick && /^en/i.test(t.languageCode || '')) pick = t;
            });
            pick = pick || tracks[0] || { languageCode: 'en' };
            player.setOption('captions', 'track', { languageCode: pick.languageCode });
          } catch (e) {}
        }, 600);
      } else {
        player.setOption('captions', 'track', {});
        player.unloadModule('captions');
      }
    } catch (e) {}
  }

  // ---- Scores ----
  function num(x) { return String(Math.round(x * 100) / 100); }
  function tally(r) {            // points scored in a round, and whether any answer is marked
    var sum = 0, marked = false;
    (r.scores || []).forEach(function (s) {
      var v = parseFloat(s);
      if (!isNaN(v)) { sum += v; marked = true; }
    });
    return { sum: sum, marked: marked };
  }
  function available(r) {        // what the round is worth; defaults to one point per question
    var p = parseFloat(r.points);
    return isNaN(p) ? (r.answers || []).length : p;
  }
  function renderScores(rounds, r) {
    var mine = r ? tally(r) : { marked: false };
    $('rscore').style.display = mine.marked ? 'block' : 'none';
    if (mine.marked) $('rscorev').textContent = num(mine.sum) + ' / ' + num(available(r));
    var got = 0, total = 0;
    rounds.forEach(function (x) { got += tally(x).sum; total += available(x); });
    $('qscore').style.display = rounds.length ? 'block' : 'none';
    $('qscorev').textContent = num(got) + ' / ' + num(total);
  }

  function render() {
    var st = env.state, rounds = st.rounds || [], r = rounds[st.current];
    renderScores(rounds, r);

    if (env.qr) { $('qr').src = env.qr; $('qr').style.display = 'block'; }
    else { $('qr').style.display = 'none'; }
    $('url').textContent = env.url ? env.url.replace('http://', '') : (env.notice || '');

    $('roundnum').textContent = r ? 'Round ' + (st.current + 1) + ' of ' + rounds.length : '';
    $('round').textContent = r ? (r.name || 'Round ' + (st.current + 1)) : 'Scan the code to set up the quiz';

    var list = $('list');
    list.textContent = '';
    var answers = r ? (r.answers || []) : [];
    if (!answers.length) {
      var d = document.createElement('div');
      d.className = 'dim';
      d.textContent = 'Answers will appear here';
      list.appendChild(d);
      return;
    }
    // Text shrinks as the number of questions grows, so every row fits.
    list.style.fontSize = Math.min(4.6, 62 / answers.length) + 'vh';
    answers.forEach(function (a, i) {
      var row = document.createElement('div'); row.className = 'row';
      var n = document.createElement('div'); n.className = 'num'; n.textContent = (i + 1) + '.';
      var t = document.createElement('div'); t.className = 'txt'; t.textContent = a || '';
      row.appendChild(n); row.appendChild(t); list.appendChild(row);
    });
    fitAnswers();
  }

  // A long answer wraps onto extra lines and shrinks until it fits its row.
  function fitAnswers() {
    var vh = window.innerHeight / 100, min = 1.8 * vh;
    Array.prototype.forEach.call(document.querySelectorAll('#list .row'), function (row) {
      var t = row.querySelector('.txt');
      t.style.fontSize = '';
      t.style.whiteSpace = 'nowrap';
      if (t.scrollWidth <= t.clientWidth) return;        // fits on one line at full size
      t.style.whiteSpace = 'normal';
      var size = parseFloat(getComputedStyle(t).fontSize), limit = row.clientHeight;
      while (t.scrollHeight > limit && size > min) {
        size -= 0.2 * vh;
        t.style.fontSize = size + 'px';
      }
    });
  }
  window.addEventListener('resize', fitAnswers);

  function syncVideo() {
    var id = env ? (env.state.videoId || '') : '';
    $('novideo').style.display = id ? 'none' : 'flex';
    if (!id || !apiReady) return;
    if (!player) {
      var start = 0;
      if (env.resume && env.resume.videoId === id && env.resume.t > 5) start = Math.floor(env.resume.t);
      loadedId = id;
      player = new YT.Player('player', {
        videoId: id,
        width: '100%', height: '100%',
        playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, start: start,
                      playsinline: 1, iv_load_policy: 3, origin: location.origin },
        events: {
          onReady: function () { playerReady = true; player.playVideo(); syncVideo(); },
          onStateChange: function () { syncCaptions(); },
          onError: function (e) {
            var why = { 2: 'that link is not a valid video', 5: 'player error', 100: 'video not found',
                        101: 'the uploader does not allow this video to play here',
                        150: 'the uploader does not allow this video to play here',
                        153: 'player configuration (referrer) error' }[e.data] || 'unknown';
            showError('YouTube error ' + e.data + ': ' + why);
          }
        }
      });
    } else if (playerReady && id !== loadedId) {
      loadedId = id;
      showError('');
      player.loadVideoById(id);
    }
  }

  // ---- Playback commands from the remote and the phone ----
  window.remote = {
    toggle: function () {
      if (!playerReady) return;
      if (player.getPlayerState() === YT.PlayerState.PLAYING) this.pause(); else this.play();
    },
    play: function () {
      if (!playerReady) return;
      player.playVideo();
      showStatus('▶ ' + fmt(player.getCurrentTime()));
    },
    pause: function () {
      if (!playerReady) return;
      player.pauseVideo();
      showStatus('⏸ ' + fmt(player.getCurrentTime()));
    },
    seek: function (delta) {
      if (!playerReady) return;
      var total = player.getDuration() || 0;
      var t = Math.max(0, player.getCurrentTime() + delta);
      if (total) t = Math.min(t, total - 1);
      player.seekTo(t, true);
      showStatus((delta < 0 ? '⏪ ' : '⏩ ') + fmt(t) + (total ? ' / ' + fmt(total) : ''));
    },
    fullscreen: function () { document.body.classList.toggle('full'); },
    position: function () {
      if (!playerReady || !loadedId) return null;
      return { v: loadedId, t: player.getCurrentTime() || 0 };
    }
  };

  function onYouTubeIframeAPIReady() { apiReady = true; syncVideo(); }

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = function () { showError('Could not reach YouTube. Check the internet connection.'); };
  document.head.appendChild(tag);
</script>
</body>
</html>
