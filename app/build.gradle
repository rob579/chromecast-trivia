plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rob579.chromecasttrivia'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rob579.chromecasttrivia'
        minSdk 23
        targetSdk 34
        versionCode 8
        versionName '0.8'
    }

    // A fixed key checked into the repo, so every build can be installed
    // over the previous one without uninstalling first.
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Tiny embedded web server for the phone control page.
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // QR code shown on the TV so the phone can find the control page.
    implementation 'com.google.zxing:core:3.5.3'
}
